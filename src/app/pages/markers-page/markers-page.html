<div #map class="h-[60vh] sm:h-[calc(100vh-64px)]"></div>

<section
  aria-labelledby="markers-title"
  class="relative z-10 mx-4 my-4 flex max-h-[calc(100dvh-64px-60vh-2rem)] flex-col overflow-hidden rounded-2xl border border-white/70 bg-white/95 shadow-xl shadow-slate-900/15 backdrop-blur sm:fixed sm:left-6 sm:right-auto sm:top-20 sm:mx-0 sm:my-0 sm:max-h-[calc(100dvh-6rem)] sm:w-[22rem]"
>
  <header class="flex items-center justify-between border-b border-slate-100 px-5 py-4">
    <div>
      <h2 id="markers-title" class="text-lg font-bold tracking-tight text-slate-900">
        Marcadores
      </h2>
      <p class="mt-0.5 text-xs text-slate-500">Haz clic en el mapa para agregar uno</p>
    </div>
    <span class="rounded-full bg-slate-100 px-2.5 py-1 text-xs font-semibold text-slate-600">
      {{ markers().length }}
    </span>
  </header>

  <div class="overflow-y-auto p-3">
    @for (marker of markers(); track marker.id; let index = $index) {
      <button
        type="button"
        class="group mb-2 flex w-full items-center gap-3 rounded-xl border border-transparent bg-white px-3 py-3 text-left transition hover:border-slate-200 hover:bg-slate-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 last:mb-0"
        (click)="flyToMarker(marker.mapboxMarker.getLngLat())"
        (dblclick)="deleteMarker(marker)"
      >
        <span
          aria-hidden="true"
          class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full"
          [style.backgroundColor]="marker.color + '1a'"
        >
          <span
            class="h-4 w-4 rounded-full border-[3px] border-white shadow-sm ring-1 ring-black/10"
            [style.backgroundColor]="marker.color"
          ></span>
        </span>
        <span class="min-w-0 flex-1">
          <span class="mb-1 block text-xs font-semibold text-slate-700">
            Marcador {{ markers().length - index }}
          </span>
          <span class="flex flex-wrap gap-x-3 text-xs text-slate-500">
            <span>Lng <span class="font-medium text-slate-700">{{ marker.longitude | number:'1.4-4' }}</span></span>
            <span>Lat <span class="font-medium text-slate-700">{{ marker.latitude | number:'1.4-4' }}</span></span>
          </span>
        </span>
        <svg
          aria-hidden="true"
          class="h-4 w-4 shrink-0 text-slate-300 transition group-hover:translate-x-0.5 group-hover:text-slate-500"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
        </svg>
        <span class="sr-only">Centrar el mapa en este marcador</span>
      </button>
    } @empty {
      <div class="flex flex-col items-center rounded-xl bg-slate-50 px-5 py-8 text-center">
        <span class="mb-3 flex h-12 w-12 items-center justify-center rounded-full bg-blue-50 text-blue-600">
          <svg aria-hidden="true" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 21s7-5.2 7-12a7 7 0 10-14 0c0 6.8 7 12 7 12z" />
            <circle cx="12" cy="9" r="2.2" stroke-width="1.8" />
          </svg>
        </span>
        <p class="text-sm font-semibold text-slate-700">Aún no hay marcadores</p>
        <p class="mt-1 text-xs text-slate-500">Selecciona cualquier punto del mapa para crear el primero.</p>
      </div>
    }
  </div>
</section>
